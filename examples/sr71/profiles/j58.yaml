schema_version: 1
profile:
  id: engine.pw_j58_class
  version: 1
  type: turbofan_engine
  model: propulsion.turbofan_simple_deck
  metadata:
    display_name: P&W J58-Class Afterburning Turbojet (deck approximation)
    source: >-
      Public J58/SR-71 figures; the simple turbofan deck cannot represent an
      afterburning turbojet with ram recovery, so the Mach coefficient is
      negative and the altitude exponent is fitted to the Mach 3.2 / 19.8 km
      design point only. Off-design thrust and all TSFC values are not
      physically meaningful.
    confidence: low
  parameters:
    sea_level_static_thrust: 151.2 kN
    dry_mass: 2700 kg
    bypass_ratio: 0.0
    thrust_lapse:
      altitude_exponent: 0.55
      mach_linear_coefficient: -0.35
      minimum_fraction: 0.10
    tsfc:
      sea_level_takeoff: 0.180 kg/N/hr
      cruise_reference: 0.194 kg/N/hr
      cruise_reference_altitude: 65000 ft
      cruise_reference_mach: 3.2
    installation:
      thrust_loss_fraction: 0.03
      nacelle_drag_area: 0.0 m^2
    limits:
      maximum_mach: 3.3
      maximum_altitude: 85000 ft
