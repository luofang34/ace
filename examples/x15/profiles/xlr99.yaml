schema_version: 1
profile:
  id: engine.xlr99_class
  version: 1
  type: turbofan_engine
  model: propulsion.turbofan_simple_deck
  metadata:
    display_name: Reaction Motors XLR99 (rocket forced into the turbofan deck)
    source: >-
      Public X-15 figures. No rocket model exists, so the XLR99 is expressed as
      a constant-thrust "turbofan": altitude exponent 0 and Mach coefficient 0
      remove air-breathing lapse, and TSFC 1.316 kg/N/hr encodes Isp 279 s.
      Thrust is anchored to the ~250 kN mid-boost value.
    confidence: low
  parameters:
    sea_level_static_thrust: 250 kN
    dry_mass: 413 kg
    bypass_ratio: 0.0
    thrust_lapse:
      altitude_exponent: 0.0
      mach_linear_coefficient: 0.0
      minimum_fraction: 1.0
    tsfc:
      sea_level_takeoff: 1.316 kg/N/hr
      cruise_reference: 1.316 kg/N/hr
      cruise_reference_altitude: 60000 ft
      cruise_reference_mach: 4.0
    installation:
      thrust_loss_fraction: 0.0
      nacelle_drag_area: 0.0 m^2
    limits:
      maximum_mach: 6.7
      maximum_altitude: 354000 ft
