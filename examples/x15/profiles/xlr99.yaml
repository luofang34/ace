schema_version: 1
profile:
  id: engine.xlr99_class
  version: 2
  type: rocket_engine
  model: propulsion.table_deck
  metadata:
    display_name: Reaction Motors XLR99
    source: >-
      NASA X-15 program histories report 57,000 lbf maximum thrust and more
      than 13,000 lb/min propellant flow for the throttleable XLR99. The
      constant 263 s table value reproduces those public full-power anchors
      through T/(Isp*g0); the deck does not model mixture ratio or nozzle
      performance variation.
    confidence: medium
  parameters:
    dry_mass: 413 kg
    installation:
      thrust_loss_fraction: 0.0
      nacelle_drag_area: 0.0 m^2
    table_deck:
      axes:
        mach: [0.0, 6.7]
        altitude: [0 ft, 354000 ft]
      modes:
        takeoff:
          thrust: &rocket_thrust
            unit: N
            values:
              - [253549, 253549]
              - [253549, 253549]
          specific_impulse: &rocket_isp
            unit: s
            values:
              - [263, 263]
              - [263, 263]
        climb:
          thrust: *rocket_thrust
          specific_impulse: *rocket_isp
        cruise:
          thrust: *rocket_thrust
          specific_impulse: *rocket_isp
        economy:
          thrust: *rocket_thrust
          specific_impulse: *rocket_isp
