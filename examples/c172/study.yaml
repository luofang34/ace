schema_version: 1
study:
  id: c172-local-design-space
  name: C172 local wing and propulsion trade
  baseline:
    scenario_path: scenario.yaml
  variables:
    - id: wing_area
      path: aircraft.geometry.wing.area
      kind: continuous
      values: ["14.5 m^2", "16.17 m^2", "18.0 m^2"]
    - id: aspect_ratio
      path: aircraft.geometry.wing.aspect_ratio
      kind: continuous
      values: ["7.0", "7.49", "8.0"]
    - id: propulsion_sizing
      path: aircraft.propulsion.sizing_factor
      kind: continuous
      values: ["1.0", "1.2", "1.4"]
    - id: fuel_capacity
      path: aircraft.mass.maximum_fuel_mass
      kind: continuous
      values: ["130 kg", "144 kg", "158 kg"]
  derived_parameters:
    - target: aircraft.geometry.wing.span
      method: derive_from_area_and_aspect_ratio
    - target: aircraft.mass.maximum_takeoff_mass
      method: preserve_baseline_mass_closure
  objectives:
    - id: minimize_fuel
      metric: mission.total_fuel
      direction: minimize
    - id: minimize_takeoff_distance
      metric: performance.takeoff_field_length
      direction: minimize
      weight: 0.5
    - id: maximize_completed_distance
      metric: mission.completed_distance
      direction: maximize
      weight: 0.25
  constraints:
    - id: mission_completed
      metric: mission.completed
      operator: eq
      value: "true"
    - id: landing_stall
      metric: performance.stall_speed_landing
      operator: le
      value: "50 kt"
  analysis:
    screening_backend: native
    refinement_backend: openvsp
    refinement_candidate_limit: 3
  search:
    strategy: grid
    max_evaluations: 81
    population: 18
    generations: 6
    seed: 172
