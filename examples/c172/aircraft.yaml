schema_version: 1
aircraft:
  id: c172_class_reference
  name: C172-Class Reference Aircraft
  category: normal_category_light_aircraft
  configuration: conventional_tail
  propulsion_architecture: single_piston_propeller
  topology:
    version: 1
    components:
      - id: fuselage
        kind: fuselage
        roles: [payload_volume, primary_structure]
      - id: wing
        kind: wing
        roles: [lift, fuel_storage]
      - id: horizontal_tail
        kind: horizontal_tail
        roles: [pitch_control]
      - id: vertical_tail
        kind: vertical_tail
        roles: [directional_control]
      - id: powerplant
        kind: engine
        definition: engine.lycoming_io360_class
      - id: propeller
        kind: propeller
        definition: propeller.constant_speed_light_aircraft
    relationships:
      - { kind: attached_to, source: wing, target: fuselage }
      - { kind: attached_to, source: horizontal_tail, target: fuselage }
      - { kind: attached_to, source: vertical_tail, target: fuselage }
      - { kind: attached_to, source: powerplant, target: fuselage }
      - { kind: attached_to, source: propeller, target: powerplant }
      - { kind: carries_load_to, source: wing, target: fuselage }
  metadata:
    purpose: software demonstration and model calibration
    certification_use: prohibited
  mass:
    maximum_takeoff_mass: 1111 kg
    operating_empty_mass: 767 kg
    maximum_payload_mass: 376 kg
    maximum_fuel_mass: 144 kg
  geometry:
    wing:
      area: 16.17 m^2
      span: 11.0 m
      aspect_ratio: 7.49
      sweep_quarter_chord: 0 deg
      center_body_edge_sweep: null
  aerodynamics:
    model: aero.parabolic_polar
    clean:
      cd0: 0.031
      additional_cd: 0.002
      oswald_efficiency: 0.80
      cl_max: 1.45
    takeoff:
      cd0: 0.041
      oswald_efficiency: 0.76
      cl_max: 1.75
    landing:
      cd0: 0.062
      oswald_efficiency: 0.72
      cl_max: 2.05
  propulsion:
    profile: engine.lycoming_io360_class
    engine_count: 1
    sizing_factor: 1.0
    propeller_profile: propeller.constant_speed_light_aircraft
  limits:
    maximum_operating_speed: 163 kt
    maximum_load_factor: 3.8
    minimum_load_factor: -1.52
