[package]
name = "aircraft-concept-explorer"
version = "0.1.0"
edition = "2024"
description = "Deterministic early-stage fixed-wing aircraft concept exploration"
license = "AGPL-3.0-only"
repository = "https://github.com/luofang34/ace"

[[bin]]
name = "aircraft-explorer"
path = "src/bin/aircraft-explorer.rs"

[[bin]]
name = "aex"
path = "src/bin/aex.rs"

[dependencies]
ace-model = { path = "crates/ace-model" }
ace-engine = { path = "crates/ace-engine" }
ace-physics = { path = "crates/ace-physics" }
ace-sheet = { path = "crates/ace-sheet" }
ace-study = { path = "crates/ace-study" }
ace-drawing = { path = "crates/ace-drawing" }
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = { version = "0.4.41", features = ["serde"] }
clap = "4.5.42"
csv = "1.3.1"
hex = "0.4.3"
plotters = "0.3.7"
rayon = "1.10.0"
rmcp = { version = "0.16.0", features = ["client", "server", "transport-child-process", "transport-io"] }
roots = "0.0.8"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.142", features = ["float_roundtrip"] }
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "io-std", "process", "time", "signal", "net", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uom = { version = "0.38.0", features = ["f64", "si", "std"] }

[dev-dependencies]
approx = "0.5.1"
assert_cmd = "2.0.17"
predicates = "3.1.3"

[workspace]
members = ["crates/ace-model", "crates/ace-engine", "crates/ace-physics", "crates/ace-sheet", "crates/ace-study", "crates/ace-drawing", "crates/ace-cfd"]
default-members = [".", "crates/ace-model", "crates/ace-engine", "crates/ace-physics", "crates/ace-sheet", "crates/ace-study", "crates/ace-drawing", "crates/ace-cfd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/luofang34/ace"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.142", features = ["float_roundtrip"] }
thiserror = "2.0.12"
sha2 = "0.10.9"
hex = "0.4.3"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
