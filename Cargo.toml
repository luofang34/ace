[package]
name = "aircraft-concept-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic early-stage fixed-wing aircraft concept exploration"
license = "MIT"
repository = "https://example.invalid/aircraft-concept-explorer"

[[bin]]
name = "aircraft-explorer"
path = "src/bin/aircraft-explorer.rs"

[[bin]]
name = "aex"
path = "src/bin/aex.rs"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.42", features = ["derive"] }
csv = "1.3.1"
hex = "0.4.3"
plotters = "0.3.7"
rayon = "1.10.0"
rmcp = { version = "0.16.0", features = ["client", "server", "transport-child-process", "transport-io"] }
roots = "0.0.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["float_roundtrip"] }
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "io-std", "process", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uom = { version = "0.38.0", features = ["f64", "si", "std"] }

[dev-dependencies]
approx = "0.5.1"
assert_cmd = "2.0.17"
predicates = "3.1.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
await_holding_lock = "deny"
expect_used = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
panic = "deny"
unwrap_used = "deny"
